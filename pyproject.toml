[project]
name = "proofbench"
dynamic = ["version"]
description = "Build evals for agentic systems and prove each one can be trusted: gated, checked against known-score controls, graded by command or LLM judge"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "LeChristopher Blackwell" }]
keywords = ["eval", "llm", "agent", "benchmark", "prompt-optimization", "claude"]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/CodeBlackwell/proofbench"

[project.scripts]
proofbench = "proofbench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# A bare `pytest` used to collect test files agents had left in the ignored corpus clones.
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "proofbench/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["proofbench"]
