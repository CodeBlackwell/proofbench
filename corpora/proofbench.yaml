# Real corpus config: 3 easy repos, 2 benchmark-derived cases and 3 real upstream bugs, run
# through crg-debug.
# Fetch first:  bash corpora/fetch.sh
# Build next:   uv run python corpora/build_hard.py
# Then:         proofbench run --config corpora/proofbench.yaml
#
# To self-improve a skill, add `subject:` + `synth:`, set `models` to a weak leg, and mark the
# tasks the gate scores on `holdout: true` (the rewrite learns from the rest).
#
# The 2 hard cases below are single instances reconstructed from published benchmarks, each
# materialized as a buggy->fixed git pair (branches `buggy` and `fixed`):
#   - pdb-multi-shortest-substring: PDB-Multi task 3692_41 (Precise Debugging Benchmark,
#     arXiv 2604.17338). 3 atomic bugs composed into one KMP/LPS string-matching algorithm.
#     Complete ground truth by construction; scores edit-precision + bug-recall.
#   - repodebug-gvl-tracing: RepoDebug (EMNLP Findings 2025) C `wrong_return` logic bug
#     injected into a real Ruby native extension (ivoanjo/gvl-tracing); upstream = fixed ref.
#
# The 3 Tier-1 cases are real upstream fixes, each cut down to the one file the fix changed
# (`buggy` = that file at the fix commit's parent, `fixed` = at the fix commit; both commits are
# pinned under `upstream` in manifest.yaml):
#   - cpython-timsort: merge_collapse checks too few runs to keep its stack invariant
#     (python/cpython b808d590). A 2 line fix in an 88 KB C file.
#   - cpython-asyncio-cond: Condition.notify() racing Task.cancel() loses a wakeup
#     (python/cpython#112202, 6b53d5fe).
#   - sudo-baron-samedit: heap overflow in set_cmnd's unescape loop (CVE-2021-3156,
#     sudo-project/sudo 1f863857).
# All 5 are built locally under repos/ (gitignored) by corpora/build_hard.py.
runner: claude
models: [haiku]
judge_model: opus
objective: macro_recall
concurrency: 3
max_turns: 200

judge: default

# BugFix (already validated via the deterministic Workflow in Round 4) and the duplicate
# sf-wdi-24 debugging-challenges are excluded. The active sweep is the 8 entries below: 3 of
# the manifest's easy repos, then the 5 hard cases corpora/build_hard.py builds.
#
# `ignore` leaves out what an answer branch carries beside the fix (a rebuilt bundle, a rewritten
# README, a file of answer notes), so recall is not graded on files no agent should reproduce.
#
# invoke drives the crg-debugger SUBAGENT (sequential, single in-context session), not the
# background /crg-debug Workflow: the subagent honors --model haiku and applies fixes
# synchronously, so capture sees a real git diff to grade. The background Workflow returns a
# detection report and lands no diff headless, and runs its own internal models.
corpus:
  - { name: debugging-challenge,                    path: repos/debugging-challenge,                    invoke: "Use the crg-debugger subagent (Task tool, subagent_type 'crg-debug:crg-debugger') to find and fix every functional bug in this repository. Apply all fixes directly to the source files. Do not ask for confirmation.", default_branch: master, answer_branch: working, ignore: [README.md, 'assets/**'] }
  - { name: ph2-raccoon-saloon-debugging-challenge, path: repos/ph2-raccoon-saloon-debugging-challenge, invoke: "Use the crg-debugger subagent (Task tool, subagent_type 'crg-debug:crg-debugger') to find and fix every functional bug in this repository. Apply all fixes directly to the source files. Do not ask for confirmation.", default_branch: main,   answer_branch: solution }
  - { name: react-debug-practice,                   path: repos/react-debug-practice,                   invoke: "Use the crg-debugger subagent (Task tool, subagent_type 'crg-debug:crg-debugger') to find and fix every functional bug in this repository. Apply all fixes directly to the source files. Do not ask for confirmation.", default_branch: master, answer_branch: solution, ignore: ['dist/**', readme.md, src/components/key.md] }
  - { name: pdb-multi-shortest-substring,           path: repos/pdb-multi-shortest-substring,           invoke: "Use the crg-debugger subagent (Task tool, subagent_type 'crg-debug:crg-debugger') to find and fix every functional bug in this repository. Apply all fixes directly to the source files. Do not ask for confirmation.", default_branch: buggy,  answer_branch: fixed }
  - { name: repodebug-gvl-tracing,                  path: repos/repodebug-gvl-tracing,                  invoke: "Use the crg-debugger subagent (Task tool, subagent_type 'crg-debug:crg-debugger') to find and fix every functional bug in this repository. Apply all fixes directly to the source files. Do not ask for confirmation.", default_branch: buggy,  answer_branch: fixed }
  - { name: cpython-timsort,                        path: repos/cpython-timsort,                        invoke: "Use the crg-debugger subagent (Task tool, subagent_type 'crg-debug:crg-debugger') to find and fix every functional bug in this repository. Apply all fixes directly to the source files. Do not ask for confirmation.", default_branch: buggy,  answer_branch: fixed }
  - { name: cpython-asyncio-cond,                   path: repos/cpython-asyncio-cond,                   invoke: "Use the crg-debugger subagent (Task tool, subagent_type 'crg-debug:crg-debugger') to find and fix every functional bug in this repository. Apply all fixes directly to the source files. Do not ask for confirmation.", default_branch: buggy,  answer_branch: fixed }
  - { name: sudo-baron-samedit,                     path: repos/sudo-baron-samedit,                     invoke: "Use the crg-debugger subagent (Task tool, subagent_type 'crg-debug:crg-debugger') to find and fix every functional bug in this repository. Apply all fixes directly to the source files. Do not ask for confirmation.", default_branch: buggy,  answer_branch: fixed }
