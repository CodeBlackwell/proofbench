# Real corpus config: 3 easy repos, 2 benchmark-derived cases and 3 real upstream bugs, run
# through crg-debug.
# Fetch first:  bash corpora/fetch.sh
# Build next:   uv run python corpora/build_hard.py
# Then:         proofbench run --config corpora/proofbench.yaml
#
# To self-improve a skill, add `subject:` + `synth:`, set `models` to a weak leg, and mark the
# tasks the gate scores on `holdout: true` (the rewrite learns from the rest).
#
# The 2 hard cases below are single instances reconstructed from published benchmarks, each
# materialized as a buggy->fixed git pair (branches `buggy` and `fixed`):
#   - pdb-multi-shortest-substring: PDB-Multi task 3692_41 (Precise Debugging Benchmark,
#     arXiv 2604.17338). 3 atomic bugs composed into one KMP/LPS string-matching algorithm.
#     Complete ground truth by construction; scores edit-precision + bug-recall.
#   - repodebug-gvl-tracing: RepoDebug (EMNLP Findings 2025) C `wrong_return` logic bug
#     injected into a real Ruby native extension (ivoanjo/gvl-tracing); upstream = fixed ref.
#
# The 3 Tier-1 cases are real upstream fixes, each cut down to the one file the fix changed
# (`buggy` = that file at the fix commit's parent, `fixed` = at the fix commit; both commits are
# pinned under `upstream` in manifest.yaml):
#   - cpython-timsort: merge_collapse checks too few runs to keep its stack invariant
#     (python/cpython b808d590). A 2 line fix in an 88 KB C file.
#   - cpython-asyncio-cond: Condition.notify() racing Task.cancel() loses a wakeup
#     (python/cpython#112202, 6b53d5fe).
#   - sudo-baron-samedit: heap overflow in set_cmnd's unescape loop (CVE-2021-3156,
#     sudo-project/sudo 1f863857).
# All 5 are built locally under repos/ (gitignored) by corpora/build_hard.py.
runner: claude
models: [haiku]
judge_model: opus
objective: macro_recall
concurrency: 3
max_turns: 200

judge: default

# BugFix (already validated via the deterministic Workflow in Round 4) and the duplicate
# sf-wdi-24 debugging-challenges are excluded. The active sweep is the 8 entries below: 3 of
# the manifest's easy repos, then the 5 hard cases corpora/build_hard.py builds.
#
# `ignore` leaves out what an answer branch carries beside the fix (a rebuilt bundle, a rewritten
# README, a file of answer notes), so recall is not graded on files no agent should reproduce.
# Every task also ignores the scratch that `code-review-graph build` scatters through a repo to
# advertise its tools: the graph folder at any depth, and assistant scaffolding at the root. It
# is never the agent's fix, so it must not count against precision.
#
# invoke drives the crg-debugger SUBAGENT (sequential, single in-context session), not the
# background /crg-debug Workflow: the subagent honors --model haiku and applies fixes
# synchronously, so capture sees a real git diff to grade. The background Workflow returns a
# detection report and lands no diff headless, and runs its own internal models.
corpus:
  - { name: debugging-challenge,                    path: repos/debugging-challenge,                    invoke: &invoke "Use the crg-debugger subagent (Task tool, subagent_type 'crg-debug:crg-debugger') to find and fix every functional bug in this repository. Apply all fixes directly to the source files. Do not ask for confirmation.", default_branch: master, answer_branch: working, ignore: [README.md, 'assets/**', '**/.code-review-graph/**', .mcp.json, .opencode.json, .cursorrules, .windsurfrules, AGENTS.md, CLAUDE.md, GEMINI.md, QODER.md, '.claude/**', '.cursor/**', '.gemini/**', '.kiro/**', '.qoder/**'] }
  - { name: ph2-raccoon-saloon-debugging-challenge, path: repos/ph2-raccoon-saloon-debugging-challenge, invoke: "Use the crg-debugger subagent (Task tool, subagent_type 'crg-debug:crg-debugger') to find and fix every functional bug in this repository. Apply all fixes directly to the source files. Do not ask for confirmation.", default_branch: main,   answer_branch: solution, ignore: &scratch ['**/.code-review-graph/**', .mcp.json, .opencode.json, .cursorrules, .windsurfrules, AGENTS.md, CLAUDE.md, GEMINI.md, QODER.md, '.claude/**', '.cursor/**', '.gemini/**', '.kiro/**', '.qoder/**'] }
  - { name: react-debug-practice,                   path: repos/react-debug-practice,                   invoke: "Use the crg-debugger subagent (Task tool, subagent_type 'crg-debug:crg-debugger') to find and fix every functional bug in this repository. Apply all fixes directly to the source files. Do not ask for confirmation.", default_branch: master, answer_branch: solution, ignore: ['dist/**', readme.md, src/components/key.md, '**/.code-review-graph/**', .mcp.json, .opencode.json, .cursorrules, .windsurfrules, AGENTS.md, CLAUDE.md, GEMINI.md, QODER.md, '.claude/**', '.cursor/**', '.gemini/**', '.kiro/**', '.qoder/**'] }
  - { name: pdb-multi-shortest-substring,           path: repos/pdb-multi-shortest-substring,           invoke: "Use the crg-debugger subagent (Task tool, subagent_type 'crg-debug:crg-debugger') to find and fix every functional bug in this repository. Apply all fixes directly to the source files. Do not ask for confirmation.", default_branch: buggy,  answer_branch: fixed, ignore: *scratch }
  - { name: repodebug-gvl-tracing,                  path: repos/repodebug-gvl-tracing,                  invoke: "Use the crg-debugger subagent (Task tool, subagent_type 'crg-debug:crg-debugger') to find and fix every functional bug in this repository. Apply all fixes directly to the source files. Do not ask for confirmation.", default_branch: buggy,  answer_branch: fixed, ignore: *scratch }
  # The three upstream answers change more than the fix inside the one file they touch
  # (reworded docstrings, cosmetic rewrites), which `ignore` cannot leave out. Each task lists
  # its `items`, so recall is counted over what the fix does and nothing else.
  - name: cpython-timsort
    path: repos/cpython-timsort
    invoke: *invoke
    default_branch: buggy
    answer_branch: fixed
    ignore: *scratch
    items:
      - "merge_collapse also merges when the invariant fails one run deeper in the stack (p[n-2].len <= p[n-1].len + p[n].len), so the invariant holds over the top four runs and not only the top three"
  - name: cpython-asyncio-cond
    path: repos/cpython-asyncio-cond
    invoke: *invoke
    default_branch: buggy
    answer_branch: fixed
    ignore: *scratch
    items:
      - "Condition.wait: a waiter that was already notified and is then cancelled before it resumes passes the wakeup on to another waiter"
      - "Condition.wait: the wakeup is also passed on when the cancellation, or any other exception, arrives while the waiter is re-acquiring the lock after a successful notify"
  - name: sudo-baron-samedit
    path: repos/sudo-baron-samedit
    invoke: *invoke
    default_branch: buggy
    answer_branch: fixed
    ignore: *scratch
    items:
      - "set_cmnd: a backslash that is the last character of an argument is not treated as an escape, so the copy never steps past the string's terminator"
      - "set_cmnd: backslashes are unescaped only when a command is really being run through a shell (MODE_SHELL or MODE_LOGIN_SHELL together with MODE_RUN), so arguments the front end never escaped are left alone"
      - "set_cmnd: the command lookup branch is taken whenever MODE_EDIT is not set, where it used to be taken whenever MODE_RUN or MODE_CHECK was set"
      - "set_cmnd: every write into user_args is checked against the size of the buffer, and an overflow is reported as an error and never written"
