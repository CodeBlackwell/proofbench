# The question task kind. Nothing here reaches the network:
#   proofbench run --config examples/question-demo/proofbench.question.yaml
#
# The runner is any executable that reads one question JSON object on stdin and prints one
# result object on stdout. This one is a stub that answers from the answer key, so the demo
# grades to fixed numbers; a real arm answers from a corpus and never sees the key.
runner: arms/oracle-tier1.py
models: [stub]
judge_model: opus          # held constant, and only reached when an id match cannot settle it
objective: tokens_per_correct
concurrency: 2
max_turns: 1

# runner_args are appended to the arm's argv after --model MODEL. The oracle needs none. A real
# arm is told here which frozen corpus to read, so the config alone says what the run ran
# against:  runner_args: [--snapshot, 3f9a2c1b8e...]
judge: judge.md

corpus:
  - kind: question
    file: questions/lineage.jsonl
